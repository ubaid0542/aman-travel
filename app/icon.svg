<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f3d" />
      <stop offset="100%" stop-color="#083a66" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a" />
      <stop offset="100%" stop-color="#f5b324" />
    </linearGradient>
    <linearGradient id="snowLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e1effa" />
    </linearGradient>
    <linearGradient id="mountainShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144d7a" />
      <stop offset="100%" stop-color="#0a2a45" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd45a" />
      <stop offset="100%" stop-color="#d49a15" />
    </linearGradient>
  </defs>

  <!-- Background Shield/Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#skyGrad)" stroke="url(#goldBorder)" stroke-width="2.5" />

  <!-- Golden Sunrise -->
  <circle cx="32" cy="24" r="11" fill="url(#sunGrad)" opacity="0.95" />

  <!-- Mountain Left/Back -->
  <polygon points="6,54 22,26 38,54" fill="#0c3559" />
  <polygon points="22,26 27,35 22,33 17,35" fill="#ffffff" opacity="0.95" />

  <!-- Mountain Right/Back -->
  <polygon points="26,54 44,27 58,54" fill="#0d3c63" />
  <polygon points="44,27 49,36 44,34 39,36" fill="#ffffff" opacity="0.95" />

  <!-- Central Tall Himalayan Snow Peak (Front) -->
  <polygon points="12,54 32,15 52,54" fill="url(#mountainShade)" />
  
  <!-- Snow Cap on Central Peak -->
  <polygon points="32,15 40,30 32,27 24,30" fill="url(#snowLeft)" />
  <polygon points="32,15 32,27 24,30" fill="#ffffff" />
  
  <!-- Valley floor base -->
  <path d="M4,53 Q32,49 60,53 L60,58 Q32,58 4,58 Z" fill="#04182b" />
  
  <!-- Golden Travel Sparkle / Polaris Star -->
  <path d="M48,11 L49.5,14.5 L53,16 L49.5,17.5 L48,21 L46.5,17.5 L43,16 L46.5,14.5 Z" fill="#ffd45a" />
</svg>
